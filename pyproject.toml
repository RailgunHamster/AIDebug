[tool.ruff]
target-version = "py310"
line-length = 120
extend-include = ["SCsub"]
extend-exclude = ["thirdparty", "**/bin", "**/obj"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
ignore = ["UP015"]

[tool.ruff.lint.per-file-ignores]
"SCsub" = ["E402", "F403", "F405"]

[tool.ruff.lint.isort]
sections = { metadata = ["misc.utility.scons_hints"] }
section-order = ["future", "metadata", "standard-library", "third-party", "first-party", "local-folder"]
